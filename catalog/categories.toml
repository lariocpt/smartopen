# What the wizard walks through, in order. Navigators first — the wizard treats the
# `directories` category as step 0 and offers to install and wire yazi/broot. Within a
# category the first choice is the recommendation. `$EDITOR`, `$TERMINAL` and `open` are
# assumed rather than installed.

[[category]]
id = "directories"
title = "Folders"
summary = "What Enter on a folder offers. yazi and broot are the navigators that open files through this menu."
kind = "folder"
[[category.choice]]
tool = "yazi"
label = "Browse in yazi"
run = "yazi {path}"
icon = "[yazi]"
[[category.choice]]
tool = "broot"
label = "Browse in broot"
run = "broot {path}"
icon = "[broot]"
[[category.choice]]
tool = "gitui"
label = "Git UI"
description = "gitui in this folder"
run = "sh -c 'cd \"$1\" && gitui' _ {path}"
icon = "[git]"
platform = "unix"
[[category.choice]]
tool = "lazygit"
label = "lazygit"
run = "lazygit -p {path}"
icon = "[git]"
[[category.choice]]
tool = "$TERMINAL"
label = "Open in a new terminal"
run = "true"
icon = "[term]"
[[category.choice]]
tool = "$EDITOR"
label = "Open in editor"
run = "${EDITOR:-micro} {path}"
icon = "[edit]"
platform = "unix"

[[category]]
id = "markdown"
title = "Markdown"
summary = "README.md and notes."
extensions = ["md", "markdown"]
[[category.choice]]
tool = "glow"
label = "Render Markdown"
description = "Rendered view in glow"
run = "glow -p {path}"
icon = "[md]"
[[category.choice]]
tool = "mdfried"
label = "Render with images"
description = "mdfried: images and big headers via terminal graphics"
run = "mdfried {path}"
icon = "[md]"
[[category.choice]]
tool = "$EDITOR"
label = "Edit"
run = "${EDITOR:-micro} {path}"
icon = "[edit]"
platform = "unix"

