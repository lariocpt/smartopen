# The wizard's tool catalogue.
#
# EVERY INSTALL KEY IS A VERIFIED CLAIM (2026-08-31):
#   cargo  = the crate of that name IS this tool — checked on crates.io. Missing on purpose
#            for micro, glow, chafa, mpv, helix, hl, fx, lazygit, lnav, lynx, neovim: those
#            names on crates.io are unrelated crates (a macro playground, GL bindings…) or
#            the tool is not Rust. src/catalog.rs refuses a cargo key for them.
#   pacman = in the Arch repositories — checked with `pacman -Si`.
#   brew   = the Homebrew formula name, for the mainstream tools only.
#   apt/dnf = only the long-established C tools whose package names are stable.
#   github = owner/repo, for a release-asset fallback through `eget`.
# A missing key means "not there", not "didn't look".

[[tool]]
name = "yazi"
summary = "Terminal file manager with previews; the main way into this menu"
homepage = "https://yazi-rs.github.io"
[tool.install]
cargo = "yazi-fm yazi-cli"
pacman = "yazi"
brew = "yazi"
winget = "sxyazi.yazi"
github = "sxyazi/yazi"

