# opn example config
#
# Terminal-first associations (GUI apps are opened normally, not from this menu):
# directories -> terminal/tree/croft, Markdown -> mdfried, Office files -> doxx/xleak,
# CSV -> csvi/qo/xan/micro, .env* -> lazyenv, HTML -> carbonyl/micro, text/code -> micro.

# Optional: uncomment to use a banner file above interactive menus.
# Relative art paths resolve from this config file's directory.
#
# [menu]
# art_file = "art/default.txt"

[[folder]]

[[folder.command]]
label = "Open in Terminal"
description = "Open this folder in terminal"
icon = "🖥️"
run = "terminal {path}"

[[folder.command]]
label = "View with Tree"
description = "View folder structure with tree"
icon = "🌲"
run = "tree {path}"

[[folder.command]]
label = "Open in IDE"
description = "Open folder in $IDE"
icon = "📁"
run = "${IDE:-croft} {path}"

[[extension]]
extensions = ["md", "markdown"]

[[extension.command]]
label = "Render Markdown"
description = "View rendered Markdown with mdfried"
icon = "📝"
run = "mdfried {path}"

[[extension.command]]
label = "Edit"
description = "Open in ${EDITOR:-micro}"
icon = "✏️"
run = "${EDITOR:-micro} {path}"

[[extension.command]]
label = "Reveal"
description = "Open the containing folder"
icon = "📁"
run = "xdg-open {dir}"

[[extension]]
extensions = ["docx"]

[[extension.command]]
label = "View Word document"
description = "View .docx with doxx"
icon = "📘"
run = "doxx {path}"

[[extension.command]]
label = "Reveal"
description = "Open the containing folder"
icon = "📁"
run = "xdg-open {dir}"

[[extension]]
extensions = ["xlsx", "xls"]

[[extension.command]]
label = "View spreadsheet"
description = "View Excel files with xleak interactive mode"
icon = "📈"
run = "xleak -i {path}"

[[extension.command]]
label = "Reveal"
description = "Open the containing folder"
icon = "📁"
run = "xdg-open {dir}"

[[extension]]
extensions = ["csv"]

[[extension.command]]
label = "Open in csvi"
description = "View CSV with csvi"
icon = "📊"
run = "csvi {path}"

[[extension.command]]
label = "Open in qo"
description = "View CSV with qo"
icon = "📊"
run = "qo {path}"

[[extension.command]]
label = "View CSV with xan"
description = "View CSV with xan, paged and without the 100-row cap"
icon = "📊"
run = "xan view -p -A {path}"

[[extension.command]]
label = "Edit in Micro"
description = "Open the CSV file in micro"
icon = "✏️"
run = "${EDITOR:-micro} {path}"

[[association]]
match = { dirs = false, names = [".env"], name_patterns = [".env.*", "*.env"] }

[[association.command]]
label = "Edit env"
description = "Open lazyenv for the target file's parent folder"
icon = "🔐"
run = "lazyenv {dir}"

[[association.command]]
label = "Edit"
description = "Open in ${EDITOR:-micro}"
icon = "✏️"
run = "${EDITOR:-micro} {path}"

[[association.command]]
label = "Reveal"
description = "Open the containing folder"
icon = "📁"
run = "xdg-open {dir}"

[[extension]]
extensions = ["html", "htm", "xhtml"]

[[extension.command]]
label = "Open in Lynx"
description = "Browse the HTML file in the lynx terminal browser"
icon = "🌐"
run = "lynx {path}"

[[extension.command]]
label = "Open in Carbonyl"
description = "Open the HTML file in the carbonyl terminal browser"
icon = "🌐"
run = "carbonyl {path}"

[[extension.command]]
label = "Edit in Micro"
description = "Open the HTML file in micro"
icon = "✏️"
run = "${EDITOR:-micro} {path}"

[[extension]]
extensions = ["sql"]

[[extension.command]]
label = "Open in SQL IDE"
description = "Open the SQL file in $SQL_IDE"
icon = "🗄️"
run = "${SQL_IDE:-harlequin} {path}"

[[extension.command]]
label = "Edit"
description = "Open in $EDITOR"
icon = "✏️"
run = "${EDITOR:-micro} {path}"

[[extension]]
extensions = [
  "txt", "text", "log",
  "json", "js", "mjs", "cjs",
  "toml", "yaml", "yml", "xml",
  "sh", "bash", "zsh", "fish",
  "rs", "py", "ts", "tsx", "jsx",
  "css", "scss", "sass", "less",
  "c", "h", "cpp", "hpp", "go",
  "java", "kt", "kts", "lua", "rb",
  "php", "ini", "conf", "cfg",
]

[[extension.command]]
label = "Edit in Micro"
description = "Open text/code in micro"
icon = "✏️"
run = "${EDITOR:-micro} {path}"

[[association]]
match = { dirs = false, empty = true }

[[association.command]]
label = "Edit"
description = "Open empty files directly in micro"
icon = "✏️"
run = "${EDITOR:-micro} {path}"

