# opn example config
#
# These associations mirror the built-in rules from ../yazi-opener-config:
# directories -> terminal/tree/croft/gram/code, Markdown -> mdfried, Office files -> doxx/xleak,
# CSV -> csvi/qo/xan/micro/gram, .env* -> lazyenv, HTML -> Gram/Micro, text/code -> Micro/Gram.

# Optional: uncomment to use a banner file above interactive menus.
# Relative art paths resolve from this config file's directory.
#
# [menu]
# art_file = "art/default.txt"

[[folder]]

[[folder.command]]
label = "Open in Terminal"
description = "Open this folder in terminal"
icon = "🖥️"
run = "terminal {path}"

[[folder.command]]
label = "View with Tree"
description = "View folder structure with tree"
icon = "🌲"
run = "tree {path}"

[[folder.command]]
label = "Open in Croft"
description = "Open folder in croft"
icon = "📁"
run = "croft {path}"

[[folder.command]]
label = "Open in Gram"
description = "Open folder in gram"
icon = "📖"
run = "gram {path}"
detach = true

[[folder.command]]
label = "Open in VS Code"
description = "Open folder in VS Code"
icon = "💻"
run = "code {path}"
detach = true

[[extension]]
extensions = ["code-workspace"]

[[extension.command]]
label = "Open in VS Code"
description = "Open workspace in VS Code"
icon = "💻"
run = "code {path}"
detach = true

[[extension]]
extensions = ["md", "markdown"]

[[extension.command]]
label = "Render Markdown"
description = "View rendered Markdown with mdfried"
icon = "📝"
run = "mdfried {path}"

[[extension.command]]
label = "Edit"
description = "Open in ${EDITOR:-micro}"
icon = "✏️"
run = "${EDITOR:-micro} {path}"

[[extension.command]]
label = "Reveal"
description = "Open the containing folder"
icon = "📁"
run = "xdg-open {dir}"

[[extension]]
extensions = ["docx"]

[[extension.command]]
label = "View Word document"
description = "View .docx with doxx"
icon = "📘"
run = "doxx {path}"

[[extension.command]]
label = "Reveal"
description = "Open the containing folder"
icon = "📁"
run = "xdg-open {dir}"

[[extension]]
extensions = ["xlsx", "xls"]

[[extension.command]]
label = "View spreadsheet"
description = "View Excel files with xleak interactive mode"
icon = "📈"
run = "xleak -i {path}"

[[extension.command]]
label = "Reveal"
description = "Open the containing folder"
icon = "📁"
run = "xdg-open {dir}"

[[extension]]
extensions = ["csv"]

[[extension.command]]
label = "Open in csvi"
description = "View CSV with csvi"
icon = "📊"
run = "csvi {path}"

[[extension.command]]
label = "Open in qo"
description = "View CSV with qo"
icon = "📊"
run = "qo {path}"

[[extension.command]]
label = "View CSV with xan"
description = "View CSV with xan, paged and without the 100-row cap"
icon = "📊"
run = "xan view -p -A {path}"

[[extension.command]]
label = "Edit in Micro"
description = "Open the CSV file in micro"
icon = "✏️"
run = "micro {path}"

[[extension.command]]
label = "Open in Gram"
description = "Open the CSV file in Gram"
icon = "📖"
run = "gram {path}"
detach = true

[[association]]
match = { dirs = false, names = [".env"], name_patterns = [".env.*", "*.env"] }

[[association.command]]
label = "Edit env"
description = "Open lazyenv for the target file's parent folder"
icon = "🔐"
run = "lazyenv {dir}"

[[association.command]]
label = "Edit"
description = "Open in ${EDITOR:-micro}"
icon = "✏️"
run = "${EDITOR:-micro} {path}"

[[association.command]]
label = "Reveal"
description = "Open the containing folder"
icon = "📁"
run = "xdg-open {dir}"

[[extension]]
extensions = ["html", "htm", "xhtml"]

[[extension.command]]
label = "Open in Gram"
description = "Open the HTML file in Gram"
icon = "📖"
run = "gram {path}"
detach = true

[[extension.command]]
label = "Edit in Micro"
description = "Open the HTML file in micro"
icon = "✏️"
run = "micro {path}"

[[extension]]
extensions = [
  "txt", "text", "log",
  "json", "js", "mjs", "cjs",
  "toml", "yaml", "yml", "xml",
  "sh", "bash", "zsh", "fish",
  "rs", "py", "ts", "tsx", "jsx",
  "css", "scss", "sass", "less",
  "c", "h", "cpp", "hpp", "go",
  "java", "kt", "kts", "lua", "rb",
  "php", "sql", "ini", "conf", "cfg",
]

[[extension.command]]
label = "Edit in Micro"
description = "Open text/code in micro"
icon = "✏️"
run = "micro {path}"

[[extension.command]]
label = "Open in Gram"
description = "Open text/code in Gram"
icon = "📖"
run = "gram {path}"
detach = true

[[association]]
match = { dirs = false, empty = true }

[[association.command]]
label = "Edit"
description = "Open empty files directly in micro"
icon = "✏️"
run = "micro {path}"

