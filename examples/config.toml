# smartopen example config — Linux
#
# Terminal-first associations (GUI apps are opened normally, not from this menu):
# directories -> terminal/editor/gitui, Markdown -> mdfried, Office files -> doxx/xleak,
# CSV -> csvi/xan, .env* -> lazyenv, HTML -> lynx/carbonyl, text and code -> $EDITOR,
# scripts by their shebang, URLs by scheme. This is the config `smartopen config init`
# writes on Linux; the macOS and Windows ones live beside it.
#
# `{path}` is the first target and `{paths}` every one of them — a selection from yazi
# arrives as several, so commands for tools that take several files use `{paths}`.
# `smartopen config doctor` says which of the tools named here are installed.

# Optional: uncomment to use a banner file above interactive menus.
# Relative art paths resolve from this config file's directory.
#
# [menu]
# art_file = "art/default.txt"

[[folder]]

[[folder.command]]
label = "Open in Terminal"
description = "A new terminal window here: $TERMINAL, or the first one installed"
icon = "🖥️"
run = "${SHELL:-sh}"
cwd = "{path}"
terminal = true

[[folder.command]]
label = "Open in Editor"
description = "Open the folder in $EDITOR"
icon = "✏️"
run = "${EDITOR:-micro} {paths}"

[[folder.command]]
label = "Open in Broot"
description = "Explore the folder with broot"
icon = "🌳"
run = "broot {path}"

[[folder.command]]
label = "Open in Yazi"
description = "Browse the folder in yazi"
icon = "📁"
run = "yazi {path}"

[[folder.command]]
label = "Git UI"
description = "gitui in this folder"
icon = "🌿"
run = "gitui"
cwd = "{path}"

[[folder.command]]
label = "Git Top"
description = "Git dashboard in this folder"
icon = "📈"
run = "gittop"
cwd = "{path}"

[[extension]]
extensions = ["md", "markdown"]

[[extension.command]]
label = "Render Markdown"
description = "View rendered Markdown with mdfried"
icon = "📝"
run = "mdfried {path}"

[[extension.command]]
label = "Edit"
description = "Open in ${EDITOR:-micro}"
icon = "✏️"
run = "${EDITOR:-micro} {paths}"

[[extension.command]]
label = "Reveal"
description = "Open the containing folder"
icon = "📁"
run = "xdg-open {dir}"
detach = true

[[extension]]
extensions = ["docx"]

[[extension.command]]
label = "View Word document"
description = "View .docx with doxx"
icon = "📘"
run = "doxx {path}"

[[extension.command]]
label = "Reveal"
description = "Open the containing folder"
icon = "📁"
run = "xdg-open {dir}"
detach = true

[[extension]]
extensions = ["xlsx", "xls"]

[[extension.command]]
label = "View spreadsheet"
description = "View Excel files with xleak interactive mode"
icon = "📈"
run = "xleak -i {path}"

[[extension.command]]
label = "Reveal"
description = "Open the containing folder"
icon = "📁"
run = "xdg-open {dir}"
detach = true

[[extension]]
extensions = ["csv", "tsv"]

[[extension.command]]
label = "Open in csvi"
description = "View CSV with csvi"
icon = "📊"
run = "csvi {path}"

[[extension.command]]
label = "View CSV with xan"
description = "View CSV with xan, paged and without the 100-row cap"
icon = "📊"
run = "xan view -p -A {path}"

[[extension.command]]
label = "Edit"
description = "Open the CSV file in $EDITOR"
icon = "✏️"
run = "${EDITOR:-micro} {paths}"

[[association]]
match = { dirs = false, names = [".env"], name_patterns = [".env.*", "*.env"] }

[[association.command]]
label = "Edit env"
description = "Open lazyenv for the target file's parent folder"
icon = "🔐"
run = "lazyenv {dir}"

[[association.command]]
label = "Edit"
description = "Open in ${EDITOR:-micro}"
icon = "✏️"
run = "${EDITOR:-micro} {paths}"

[[extension]]
extensions = ["html", "htm", "xhtml"]

[[extension.command]]
label = "Open in Lynx"
description = "Browse the HTML file in the lynx terminal browser"
icon = "🌐"
run = "lynx {path}"

[[extension.command]]
label = "Open in Carbonyl"
description = "Open the HTML file in the carbonyl terminal browser"
icon = "🌐"
run = "carbonyl {path}"

[[extension.command]]
label = "Open in browser"
description = "The default browser"
icon = "🌐"
run = "xdg-open {path}"
detach = true

[[extension.command]]
label = "Edit"
description = "Open the HTML file in $EDITOR"
icon = "✏️"
run = "${EDITOR:-micro} {paths}"

[[extension]]
extensions = ["sql"]

[[extension.command]]
label = "Open in SQL IDE"
description = "Open the SQL file in $SQL_IDE"
icon = "🗄️"
run = "${SQL_IDE:-harlequin} {path}"

[[extension.command]]
label = "Edit"
description = "Open in $EDITOR"
icon = "✏️"
run = "${EDITOR:-micro} {paths}"

[[extension]]
extensions = [
  "txt", "text", "log",
  "json", "js", "mjs", "cjs",
  "toml", "yaml", "yml", "xml",
  "sh", "bash", "zsh", "fish",
  "rs", "py", "ts", "tsx", "jsx",
  "css", "scss", "sass", "less",
  "c", "h", "cpp", "hpp", "go",
  "java", "kt", "kts", "lua", "rb",
  "php", "ini", "conf", "cfg",
]

[[extension.command]]
label = "Edit"
description = "Open text/code in $EDITOR"
icon = "✏️"
run = "${EDITOR:-micro} {paths}"

# Scripts with no extension — `deploy`, `build`, a bin/ full of them — match on the
# interpreter their shebang line names. `*` is any interpreter; `python*` would be one.
[[association]]
match = { dirs = false, shebang = ["*"] }

[[association.command]]
label = "Run"
description = "Run the script here, after showing the command"
icon = "▶️"
run = "{path}"
confirm = true

[[association.command]]
label = "Edit"
description = "Open the script in $EDITOR"
icon = "✏️"
run = "${EDITOR:-micro} {paths}"

# Anything else that is text — an unknown extension, no shebang — by the MIME type read
# from the file's bytes.
[[association]]
match = { dirs = false, mime = ["text/*"] }

[[association.command]]
label = "Edit"
description = "Open in $EDITOR"
icon = "✏️"
run = "${EDITOR:-micro} {paths}"

[[association]]
match = { dirs = false, empty = true }

[[association.command]]
label = "Edit"
description = "Open empty files directly in $EDITOR"
icon = "✏️"
run = "${EDITOR:-micro} {paths}"

# URLs: `smartopen https://…` from a script, a keybinding or a shortcut parameter.
[[url]]
schemes = ["http", "https"]

[[url.command]]
label = "Open in browser"
description = "The default browser (xdg-open)"
icon = "🌐"
run = "xdg-open {url}"
detach = true

[[url.command]]
label = "Open in Lynx"
description = "Text-mode browser, right here"
icon = "🌐"
run = "lynx {url}"

# Shortcuts: `smartopen` with no target is a launcher. `when` hides a shortcut where it
# makes no sense, `{{name}}` asks for a value (from a command's output, here).

[[shortcut]]
label = "Project shell"
description = "Drop into a shell within the current project"
icon = "💻"
run = "${SHELL:-sh}"

[[shortcut]]
label = "Cargo test"
description = "Run the Rust test suite to verify code"
icon = "🧪"
run = "cargo test"
[shortcut.when]
cwd_has = ["Cargo.toml"]

[[shortcut]]
label = "Checkout branch"
description = "Pick a branch of this repository"
icon = "🌿"
group = "git"
run = "git checkout {{branch}}"
[shortcut.when]
cwd_has = [".git"]
[shortcut.param.branch]
choices = "git branch --format='%(refname:short)'"

[[shortcut]]
label = "gitui"
description = "Blazing fast terminal-ui for git"
icon = "🌿"
group = "git"
run = "gitui"
[shortcut.when]
cwd_has = [".git"]

[[shortcut]]
label = "gittop"
description = "Git dashboard"
icon = "📈"
group = "git"
run = "gittop"
[shortcut.when]
cwd_has = [".git"]

[[shortcut]]
label = "Editor"
description = "Modern, intuitive terminal text editor"
icon = "📝"
run = "${EDITOR:-micro}"

[[shortcut]]
label = "Yazi"
description = "Terminal file manager from home"
icon = "📁"
run = "yazi ~"

[[shortcut]]
label = "Broot"
description = "Explore files and folders from home"
icon = "🌳"
run = "broot ~"

[[shortcut]]
label = "lazyenv"
description = "Interactive visual .env file editor"
icon = "🔐"
run = "lazyenv"

[[shortcut]]
label = "Harlequin"
description = "Powerful terminal-based SQL IDE"
icon = "🗄️"
run = "harlequin"

[[shortcut]]
label = "Ducker"
description = "Docker TUI client"
icon = "🐳"
run = "ducker"

[[shortcut]]
label = "Carbonyl"
description = "Chromium-based terminal web browser"
icon = "🌐"
run = "carbonyl"

[[shortcut]]
label = "pik"
description = "Interactive process manager and killer"
icon = "🗡️"
run = "pik"

[[shortcut]]
label = "Zenith"
description = "System monitor with zoomable CPU/mem/disk/net charts"
icon = "📊"
run = "zenith"

[[shortcut]]
label = "rtorrent"
description = "Lightning-fast ncurses BitTorrent client"
icon = "🧲"
run = "rtorrent"
